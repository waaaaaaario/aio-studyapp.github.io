<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudyApp</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-purple: #6a11cb;
            --secondary-blue: #2575fc;
            --accent-yellow: #ffde59;
            --bg-light: #f4f7f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-light); height: 100vh; overflow: hidden; }
        .layout { display: flex; height: 100vh; }
        
        /* Sidebar sizing and transition */
.sidebar {
    width: 260px;
    background: linear-gradient(180deg, var(--primary-purple), var(--secondary-blue));
    color: white; 
    padding: 20px; /* Reduced padding slightly for better button fit */
    display: flex; 
    flex-direction: column; 
    flex-shrink: 0;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
}

/* Collapsed state */
.sidebar.collapsed {
    width: 90px;
}

/* THE MAGIC: Hide text labels when collapsed */
.sidebar.collapsed .nav-item span,
.sidebar.collapsed h2 {
    display: none;
}

/* Rectangular Toggle Button */
.toggle-btn {
    width: 100%;
    height: 45px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    color: white;
    cursor: pointer;
    margin-bottom: 25px;
    transition: 0.3s;
}

.toggle-btn:hover {
    background: rgba(255, 255, 255, 0.25);
}

.sidebar.collapsed .toggle-btn {
    width: 50px;
    margin-left: auto;
    margin-right: auto;
}

/* Navigation items alignment */
.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 15px;
    margin-bottom: 10px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08); /* Glassy button look */
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: white;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.2s ease;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
}

.sidebar.collapsed .nav-item {
    width: 50px;
    height: 50px;
    padding: 0;
    justify-content: center;
    margin-left: auto;
    margin-right: auto;
}

        /* Main Content */
        .main-content { flex: 1; padding: 30px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .content-section { display: none; height: 100%; overflow: hidden;}
        .content-section.active { display: flex; flex-direction: column; }

        /* Flashcard Studio Layout */
        .flashcard-studio { display: flex; height: 100%; gap: 20px; overflow: hidden; }
        .sets-sidebar {
            width: 280px; background: white; border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .sets-list { margin-top: 15px; overflow-y: auto; flex-grow: 1; }
        .set-item {
            padding: 15px; border-radius: 12px; background: #f8f9fa; margin-bottom: 10px;
            cursor: pointer; transition: 0.2s; border: 1px solid transparent;
        }
        .set-item:hover { border-color: var(--primary-purple); background: #f0f0ff; }
        
        .studio-main {
            flex: 1; background: white; border-radius: 20px; padding: 40px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        /* 3D Flashcard Styles */
        .card-scene {
            width: 400px;
            height: 250px;
            perspective: 1000px; /* Essential for 3D effect */
            margin: 20px auto;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Hides the back of the element when flipped */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card-face-front {
            background: white;
            color: var(--primary-purple);
            border: 2px solid #eee;
        }

        .card-face-back {
            background: linear-gradient(135deg, var(--primary-purple), var(--secondary-blue));
            color: white;
            transform: rotateY(180deg); /* Pre-flip the back side */
        }

        .plus-btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .plus-btn:hover { transform: scale(1.1); }

        /* Calendar Card */
        .calendar-card {
            background: white; padding: 25px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: 100%;
            display: flex; flex-direction: column;
        }
        .cal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-shrink: 0;
        }
        .view-switcher button, .nav-btns button {
            padding: 8px 15px; border: 1px solid #ddd; background: white;
            cursor: pointer; border-radius: 6px; font-weight: 600;
        }
        .view-switcher button.active { background: var(--accent-yellow); border-color: var(--accent-yellow); }

        .calendar-grid { 
            display: grid; 
            gap: 10px; 
            flex-grow: 1; 
            width: 100%;
        }
        
        /* Grid states handled via JS class switching */
        .grid-month { grid-template-columns: repeat(7, 1fr); grid-template-rows: 30px repeat(6, 1fr); }
        .grid-week { grid-template-columns: repeat(7, 1fr); grid-template-rows: 1fr; }
        .grid-day { grid-template-columns: 1fr; grid-template-rows: 1fr; }

        .day-box {
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;      /* Keeps text centered horizontally */
            justify-content: flex-start; /* Pushes content to the TOP instead of center */
            font-size: 1rem;
            background: #fff;
            padding: 10px 5px 5px 5px; /* Added more padding to the TOP (10px) */
            height: 100%;             /* Ensures the box fills the grid cell */
        }
        .day-header { font-weight: bold; color: #999; font-size: 0.85rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
        .today { background: #fff9e6; border: 2px solid var(--accent-yellow); color: #333; font-weight: bold; }
        .padding-day { opacity: 0.3; background: #fafafa; }
        
        /* Modal Styles */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 600px;
            /* This ensures the modal doesn't get cut off on small screens */
            max-height: 95vh; 
            display: flex;
            flex-direction: column;
        }

        #cards-input-area {
    /* Each row is ~50px. 50px * 6 = 300px. 
       Adjust this number to fit exactly 6 of your rows */
    max-height: 320px; 
    overflow-y: auto;
    margin-bottom: 15px;
    padding-right: 10px;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
    padding-top: 15px;
}

/* Optional: Make the scrollbar look cleaner */
#cards-input-area::-webkit-scrollbar {
    width: 6px;
}
#cards-input-area::-webkit-scrollbar-thumb {
    background-color: #ddd;
    border-radius: 10px;
}
        .content-section { 
    display: none; 
    height: 100%; 
    width: 100%; /* Ensure it fills the main content area */
}

.content-section.active { 
    display: flex; 
    flex-direction: column; 
}
        .feedback-correct {
    background-color: #d4edda !important;
    color: #155724 !important;
    border: 1px solid #c3e6cb;
    display: block;
}

.feedback-incorrect {
    background-color: #f8d7da !important;
    color: #721c24 !important;
    border: 1px solid #f5c6cb;
    display: block;
}
    </style>
</head>

                        <button id="submit-btn" onclick="()" class="view-switcher button"

    <script>
        let nav = 0; 
        let currentView = 'month';
        let activeDeck = []; 
        let cIdx = 0;
        let editingSetId = null; // Keeps track of which set we are editing
        let activeQuiz = null;
        let currentQuestionIndex = 0;

        // Replace these with your actual details from the Supabase dashboard
        let supabaseUrl = 'REPLACE_WITH_SUPABASE_URL'; 
        let supabaseKey = 'REPLACE_WITH_SUPABASE_KEY';

        // This line uses those variables to create the connection
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('collapsed');
}

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('nav-'+id).classList.add('active');
            if(id === 'calendar') render();
            if(id === 'flashcards') loadSets(); // Load data when clicking the tab
            if(id === 'quizzes') loadQuizzes();
        }

        /* --- CALENDAR LOGIC --- */
        function changeView(v) {
            currentView = v; 
            nav = 0; // Reset navigation when switching views
            document.querySelectorAll('.view-switcher button').forEach(b => b.classList.remove('active'));
            document.getElementById(v + 'Btn').classList.add('active');
            render();
        }

        function changeDate(dir) {
            nav += dir;
            render();
        }

        function render() {
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';
            grid.className = `calendar-grid grid-${currentView}`;
            
            const dt = new Date();
            
            if (currentView === 'month') {
                dt.setMonth(new Date().getMonth() + nav);
                renderMonth(dt);
            } else if (currentView === 'week') {
                dt.setDate(new Date().getDate() + (nav * 7));
                renderWeek(dt);
            } else {
                dt.setDate(new Date().getDate() + nav);
                renderDay(dt);
            }
        }

        function renderMonth(dt) {
            const grid = document.getElementById('calGrid');
            const month = dt.getMonth();
            const year = dt.getFullYear();
            
            document.getElementById('monthLabel').innerText = dt.toLocaleDateString('en-us', {month:'long', year:'numeric'});

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Render Weekday Headers
            ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(day => {
                const h = document.createElement('div');
                h.className = 'day-header';
                h.innerText = day;
                grid.appendChild(h);
            });

            // Padding days
            for(let i=0; i < firstDayOfMonth; i++) {
                const p = document.createElement('div');
                p.className = 'day-box padding-day';
                grid.appendChild(p);
            }

            // Days of the month
            for(let i=1; i <= daysInMonth; i++) {
                const dayBox = document.createElement('div');
                dayBox.className = 'day-box';
                const isToday = i === new Date().getDate() && dt.getMonth() === new Date().getMonth() && dt.getFullYear() === new Date().getFullYear();
                if(isToday) dayBox.classList.add('today');
                dayBox.innerText = i;
                grid.appendChild(dayBox);
            }
        }

        function renderWeek(dt) {
            const grid = document.getElementById('calGrid');
            const startOfWeek = new Date(dt);
            startOfWeek.setDate(dt.getDate() - dt.getDay());
            
            document.getElementById('monthLabel').innerText = `Week of ${startOfWeek.toLocaleDateString('en-us', {month:'short', day:'numeric'})}`;
            
            for(let i=0; i<7; i++) {
                const day = new Date(startOfWeek);
                day.setDate(startOfWeek.getDate() + i);
                
                const dayBox = document.createElement('div');
                dayBox.className = 'day-box';
                if(day.toDateString() === new Date().toDateString()) dayBox.classList.add('today');
                
                dayBox.innerHTML = `<span style="font-size:0.8rem; color:#999; font-weight:bold">${day.toLocaleDateString('en-us',{weekday:'short'})}</span>
                                    <span style="font-size:1.8rem">${day.getDate()}</span>`;
                grid.appendChild(dayBox);
            }
        }

        function renderDay(dt) {
            const grid = document.getElementById('calGrid');
            document.getElementById('monthLabel').innerText = dt.toLocaleDateString('en-us', {weekday:'long', month:'long', day:'numeric'});
            
            const dayBox = document.createElement('div');
            dayBox.className = 'day-box';
            dayBox.innerHTML = `<span style="font-size:4rem">${dt.getDate()}</span>
                                <span style="color:#666">${dt.toLocaleDateString('en-us', {month: 'long'})}</span>`;
            if(dt.toDateString() === new Date().toDateString()) dayBox.classList.add('today');
            
            grid.appendChild(dayBox);
        }
        // --- FLASHCARD LOGIC ---
       // --- FLASHCARD LOGIC ---
        async function loadSets() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) return;

            const { data, error } = await _supabase
                .from('flashcard_sets')
                .select('*')
                .eq('user_id', user.id)
                .order('created_at', { ascending: false });

            if (error) return console.error("Error:", error);

            const list = document.getElementById('saved-sets-list');
            if (data.length === 0) {
                list.innerHTML = '<p style="color:#999; padding:10px;">No sets found.</p>';
                return;
            }

            list.innerHTML = data.map(set => `
                <div class="set-item" style="position:relative;">
                    <div onclick='startPlaying(${JSON.stringify(set.cards).replace(/'/g, "&apos;")}, "${set.title}")'>
                        <h4>${set.title}</h4>
                        <span>${set.cards.length} cards</span>
                    </div>
                    <div style="margin-top:10px; display:flex; gap:10px;">
                        <button onclick='editSet(${JSON.stringify(set).replace(/'/g, "&apos;")})' style="font-size:0.8rem; cursor:pointer; background:none; border:1px solid #ddd; border-radius:4px; padding:2px 8px;">Edit</button>
                        <button onclick='deleteSet("${set.id}")' style="font-size:0.8rem; cursor:pointer; background:none; border:1px solid #ffb3b3; color:red; border-radius:4px; padding:2px 8px;">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function editSet(set) {
            editingSetId = set.id;
            document.getElementById('set-title').value = set.title;
            const container = document.getElementById('cards-input-area');
            container.innerHTML = ''; 
            set.cards.forEach(card => {
                addNewInputRow(card.q, card.a);
            });
            openModal();
        }

        async function saveSet() {
            const { data: { user } } = await _supabase.auth.getUser();
            const title = document.getElementById('set-title').value;
            const qs = document.querySelectorAll('.q-in');
            const as = document.querySelectorAll('.a-in');
            const cards = [];
            
            qs.forEach((q, i) => { 
                if(q.value.trim()) cards.push({q: q.value, a: as[i].value}); 
            });

            if(!title || cards.length === 0) return alert("Title and cards required");

            let error;
            if (editingSetId) {
                const result = await _supabase.from('flashcard_sets').update({ title, cards }).eq('id', editingSetId);
                error = result.error;
            } else {
                const result = await _supabase.from('flashcard_sets').insert([{ user_id: user.id, title, cards }]);
                error = result.error;
            }

            if(!error) { 
                editingSetId = null;
                closeModal(); 
                loadSets(); 
            } else { 
                alert(error.message); 
            }
        }

        async function deleteSet(setId) {
            if (!confirm("Are you sure you want to delete this set?")) return;
            const { error } = await _supabase.from('flashcard_sets').delete().eq('id', setId);
            if (!error) loadSets();
        }

        function startPlaying(cards, title) {
            activeDeck = cards; 
            cIdx = 0;
            document.getElementById('creation-ui').style.display = 'none';
            document.getElementById('player-ui').style.display = 'block';
            document.getElementById('active-set-title').innerText = title;
            updateCardDisplay();
        }

        function shuffleDeck() {
            if (activeDeck.length < 2) return;
            for (let i = activeDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [activeDeck[i], activeDeck[j]] = [activeDeck[j], activeDeck[i]];
            }
            cIdx = 0;
            const card = document.getElementById('card-inner');
            card.style.transform = "scale(0.8)";
            setTimeout(() => {
                updateCardDisplay();
                card.style.transform = ""; 
            }, 200);
        }

        function updateCardDisplay() {
            document.getElementById('card-inner').classList.remove('is-flipped');
            document.getElementById('f-front').innerText = activeDeck[cIdx].q;
            document.getElementById('f-back').innerText = activeDeck[cIdx].a;
            document.getElementById('c-count').innerText = `${cIdx + 1} / ${activeDeck.length}`;
        }

        function nextC() { 
            if(!activeDeck.length) return;
            cIdx = (cIdx + 1) % activeDeck.length; 
            updateCardDisplay(); 
        }

        function prevC() { 
            if(!activeDeck.length) return;
            cIdx = (cIdx - 1 + activeDeck.length) % activeDeck.length; 
            updateCardDisplay(); 
        }

        function exitPlayer() { 
            document.getElementById('creation-ui').style.display = 'block'; 
            document.getElementById('player-ui').style.display = 'none'; 
        }
        
        function openModal() { document.getElementById('createModal').style.display = 'flex'; }
        
        function closeModal() {
            document.getElementById('createModal').style.display = 'none';
            editingSetId = null;
            document.getElementById('set-title').value = '';
            document.getElementById('cards-input-area').innerHTML = '';
            addNewInputRow(); 
        }
        
        function addNewInputRow(q = '', a = '') {
    const container = document.getElementById('cards-input-area');
    const div = document.createElement('div');
    div.className = "card-input-row";
    div.style.display = 'flex';
    div.style.gap = '5px';
    div.style.marginBottom = '10px';
    div.style.alignItems = 'center';

    div.innerHTML = `
        <input type="text" placeholder="Question" class="q-in" value="${q}" style="flex:1; padding:8px;">
        <input type="text" placeholder="Answer" class="a-in" value="${a}" style="flex:1; padding:8px;">
        <button onclick="if(document.querySelectorAll('.card-input-row').length > 1) { this.parentElement.remove() } else { alert('Set must have at least one card!') }" 
        style="background:none; border:none; color:#ff4d4d; cursor:pointer; font-size:1.2rem; padding: 0 5px;">×</button>
    `;
    
    container.appendChild(div);

    // AUTO-SCROLL: Keep the newest row in view
    container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
}

        async function loadQuizzes() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) return;

    const { data, error } = await _supabase
        .from('quizzes')
        .select('*')
        .order('created_at', { ascending: false });

    if (error) return console.error(error);

    const list = document.getElementById('quiz-sets-list');
    list.innerHTML = data.map(quiz => `
        <div class="set-item" onclick='startQuiz(${JSON.stringify(quiz)})'>
            <h4>${quiz.title}</h4>
            <span>${quiz.questions.length} Questions</span>
        </div>
    `).join('');
}
        function startQuiz(quiz) {
    activeQuiz = quiz;
    currentQuestionIndex = 0;
    document.getElementById('quiz-creation-ui').style.display = 'none';
    document.getElementById('quiz-player-ui').style.display = 'block';
    document.getElementById('quiz-player-title').innerText = quiz.title;
    renderQuestion(currentQuestionIndex);
}

function submitAnswer() {
    const q = activeQuiz.questions[currentQuestionIndex];
    const feedback = document.getElementById('quiz-feedback');
    const submitBtn = document.getElementById('submit-btn');
    const feedbackGroup = document.getElementById('feedback-group');
    
    let isCorrect = false;

    // 1. VALIDATION & LOGIC
    if (q.type === 'multiple-choice') {
        const selected = document.querySelector('input[name="quiz-opt"]:checked');
        
        // If nothing is selected, shake and stop
        if (!selected) {
            submitBtn.classList.add('shake');
            setTimeout(() => submitBtn.classList.remove('shake'), 300);
            return; 
        }

        // Compare selected value to the stored answer string
        if (selected.value === q.answer) {
            isCorrect = true;
        }
    } else {
        const userText = document.getElementById('quiz-text-input').value.trim().toLowerCase();
        
        if (userText === "") return; // Don't submit empty text

        // Check if user input matches ANY of the acceptable answers in the array
        isCorrect = q.answer.some(a => a.toLowerCase().trim() === userText);
    }

    // 2. UI FEEDBACK
    if (isCorrect) {
        feedback.innerText = "✨ Correct! Well done.";
        feedback.className = 'feedback-correct'; // Applies green styling
    } else {
        const correctDisplay = q.type === 'multiple-choice' ? q.answer : q.answer.join(", ");
        feedback.innerText = `❌ Incorrect. The answer was: ${correctDisplay}`;
        feedback.className = 'feedback-incorrect'; // Applies red styling
    }

    // 3. THE SWAP
    submitBtn.style.display = 'none';
    feedbackGroup.style.display = 'block';
}

function nextQuestion() {
    currentQuestionIndex++;
    
    // Reset UI for the next question
    document.getElementById('submit-btn').style.display = 'block';
    document.getElementById('feedback-group').style.display = 'none';

    if (currentQuestionIndex < activeQuiz.questions.length) {
        renderQuestion(currentQuestionIndex);
    } else {
        // Handle Quiz Completion
        const container = document.getElementById('question-container');
        container.innerHTML = `<div style="text-align:center;"><h2>Quiz Complete! 🎉</h2><p>You've finished all questions.</p></div>`;
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('next-btn').innerText = "Return to Menu";
        document.getElementById('next-btn').onclick = () => {
            document.getElementById('quiz-creation-ui').style.display = 'block';
            document.getElementById('quiz-player-ui').style.display = 'none';
            // Reset the button for the next time a quiz is opened
            document.getElementById('next-btn').onclick = nextQuestion;
            document.getElementById('next-btn').innerText = "Next Question →";
        };
        document.getElementById('feedback-group').style.display = 'block';
        document.getElementById('quiz-feedback').style.display = 'none';
    }
}
        
        function addQuestionRow(type) {
    const container = document.getElementById('quiz-questions-area');
    const div = document.createElement('div');
    div.className = "quiz-question-item";
    div.dataset.type = type;
    div.style = "border-bottom: 1px solid #eee; padding: 15px 0;";

    if (type === 'multiple-choice') {
        div.innerHTML = `
            <input type="text" placeholder="Question" class="q-text" style="width:100%; margin-bottom:5px;">
            <div class="options-area">
                <input type="text" placeholder="Option 1 (Correct)" class="opt-correct" style="width:100%; border-color:green;">
                <input type="text" placeholder="Option 2" class="opt" style="width:100%;">
            </div>
            <button onclick="this.parentElement.querySelector('.options-area').insertAdjacentHTML('beforeend', '<input type=\\'text\\' class=\\'opt\\' style=\\'width:100%\\' placeholder=\\'Extra Option\\'>')">+ Add Option</button>
        `;
    } else {
        div.innerHTML = `
            <input type="text" placeholder="Question" class="q-text" style="width:100%; margin-bottom:5px;">
            <input type="text" placeholder="Accepted Answers (comma separated)" class="q-answers" style="width:100%;">
            <small>Example: Red, Blue, Green</small>
        `;
    }
    container.appendChild(div);
}

function renderQuestion(index) {
    const q = activeQuiz.questions[index];
    const container = document.getElementById('question-container');
    container.innerHTML = `<h4>${q.question}</h4>`;

    if (q.type === 'multiple-choice') {
        // Shuffle options so correct isn't always first
        const shuffled = [...q.options].sort(() => Math.random() - 0.5);
        shuffled.forEach(opt => {
            container.innerHTML += `
                <label style="display:block; margin:10px 0; padding:10px; border:1px solid #ddd; border-radius:8px; cursor:pointer;">
                    <input type="radio" name="quiz-opt" value="${opt}"> ${opt}
                </label>
            `;
        });
    } else {
        container.innerHTML += `<input type="text" id="quiz-text-input" style="width:100%; padding:10px; margin-top:10px;" placeholder="Type your answer...">`;
    }
}
        function openQuizModal() {
    document.getElementById('quizModal').style.display = 'flex';
}

function closeQuizModal() {
    document.getElementById('quizModal').style.display = 'none';
    document.getElementById('quiz-questions-area').innerHTML = '';
    document.getElementById('quiz-set-title').value = '';
}

async function saveQuiz() {
    const { data: { user } } = await _supabase.auth.getUser();
    const title = document.getElementById('quiz-set-title').value;
    const questionElements = document.querySelectorAll('.quiz-question-item');
    
    let questions = [];

    questionElements.forEach(el => {
        const type = el.dataset.type;
        const questionText = el.querySelector('.q-text').value;

        if (type === 'multiple-choice') {
            const correctOpt = el.querySelector('.opt-correct').value;
            const otherOpts = Array.from(el.querySelectorAll('.opt')).map(input => input.value);
            questions.push({
                type,
                question: questionText,
                options: [correctOpt, ...otherOpts],
                answer: correctOpt // We store the string of the correct answer
            });
        } else {
            const answers = el.querySelector('.q-answers').value.split(',').map(s => s.trim());
            questions.push({
                type,
                question: questionText,
                answer: answers // Array of acceptable text answers
            });
        }
    });

    if (!title || questions.length === 0) return alert("Please add a title and at least one question.");

    const { error } = await _supabase
        .from('quizzes')
        .insert([{ user_id: user.id, title, questions }]);

    if (error) {
        alert("Error saving quiz: " + error.message);
    } else {
        closeQuizModal();
        loadQuizzes(); // Refresh the list
    }
}
        // Initialize
        render();
        addNewInputRow(); // Initialize the first row for the modal
    </script>
</body>
