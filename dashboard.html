<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudyApp</title>
    <style>
        :root {
            --primary-purple: #6a11cb;
            --secondary-blue: #2575fc;
            --accent-yellow: #ffde59;
            --bg-light: #f4f7f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-light); 
            height: 100vh;
            overflow: hidden; 
        }

        .layout { display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, var(--primary-purple), var(--secondary-blue));
            color: white;
            padding: 30px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar h2 { margin-bottom: 40px; font-size: 1.5rem; letter-spacing: 1px; }
        
        .nav-item { 
            color: rgba(255,255,255,0.7); 
            text-decoration: none; 
            margin-bottom: 15px; 
            font-weight: 600; 
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active { 
            background: rgba(255,255,255,0.1); 
            color: white; 
        }

        /* Main Content Area */
        .main-content { 
            flex: 1; 
            padding: 30px; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .content-section { display: none; height: 100%; }
        .content-section.active { display: flex; flex-direction: column; }

        /* FLASHCARD SPECIFIC STYLES */
        .flashcard-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-scene {
            width: 450px;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 20px;
        }

        .card-inner.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 600;
            border-radius: 20px;
            background: white;
            border: 2px solid #eee;
        }

        .card-face-back {
            background: var(--accent-yellow);
            color: #222;
            transform: rotateY(180deg);
        }

        .card-nav {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            background: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Original Calendar Styles */
        .calendar-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .view-switcher button, .nav-btns button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
        }

        .view-switcher button.active { background: var(--accent-yellow); border-color: var(--accent-yellow); }

        .calendar-grid {
            display: grid;
            gap: 5px;
            flex-grow: 1;
            height: 100%;
        }

        .grid-month, .grid-week { grid-template-columns: repeat(7, 1fr); }
        .grid-day { grid-template-columns: 1fr; }

        .day-box {
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            background: #fff;
            padding: 5px;
        }

        .day-header { font-weight: bold; color: #999; font-size: 0.7rem; vertical-align: top; }
        .today { background: var(--accent-yellow); font-weight: bold; }
        .padding-day { opacity: 0.3; background: #fafafa; }
        .logout-btn { margin-top: auto; color: #ffb3b3 !important; }
    </style>
</head>
<body>

    <div class="layout">
        <nav class="sidebar">
            <h2>STUDYAPP</h2>
            <div id="nav-dashboard" class="nav-item active" onclick="showSection('dashboard')">🏠 Dashboard</div>
            <div id="nav-calendar" class="nav-item" onclick="showSection('calendar')">📅 Calendar</div>
            <div id="nav-flashcards" class="nav-item" onclick="showSection('flashcards')">🃏 Flashcards</div>
            <a href="index.html" class="nav-item logout-btn">🚪 Log Out</a>
        </nav>

        <main class="main-content">
            
            <div id="dashboard" class="content-section active">
                <div style="background: white; padding: 30px; border-radius: 20px; margin-bottom: 20px;">
                    <h1>Welcome Back!</h1>
                    <p>Select Calendar or Flashcards in the sidebar to begin.</p>
                </div>
            </div>

            <div id="flashcards" class="content-section">
                <div class="flashcard-wrapper">
                    <div class="card-scene" onclick="flipCard()">
                        <div class="card-inner" id="flashcard-inner">
                            <div class="card-face" id="card-front">Question loading...</div>
                            <div class="card-face card-face-back" id="card-back">Answer loading...</div>
                        </div>
                    </div>
                    <div class="card-nav">
                        <button class="nav-btn" onclick="prevCard()">Prev</button>
                        <span id="card-index">1 / 1</span>
                        <button class="nav-btn" onclick="nextCard()">Next</button>
                    </div>
                </div>
            </div>

            <div id="calendar" class="content-section">
                <div class="calendar-card">
                    <div class="cal-header">
                        <div class="view-switcher">
                            <button id="dayBtn" onclick="changeView('day')">Day</button>
                            <button id="weekBtn" onclick="changeView('week')">Week</button>
                            <button id="monthBtn" class="active" onclick="changeView('month')">Month</button>
                        </div>
                        <h2 id="monthLabel">Month Year</h2>
                        <div class="nav-btns">
                            <button onclick="changeDate(-1)">Prev</button>
                            <button onclick="changeDate(1)">Next</button>
                        </div>
                    </div>
                    <div id="calGrid" class="calendar-grid grid-month"></div>
                </div>
            </div>

        </main>
    </div>

    <script>
        let nav = 0;
        let currentView = 'month';

        // FLASHCARD STATE
        const flashcards = [
            { q: "What is the powerhouse of the cell?", a: "Mitochondria" },
            { q: "What is the symbol for Gold on the periodic table?", a: "Au" },
            { q: "Who wrote 'Romeo and Juliet'?", a: "William Shakespeare" }
        ];
        let cardIdx = 0;

        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            document.getElementById('nav-' + sectionId).classList.add('active');
            
            if(sectionId === 'calendar') render();
            if(sectionId === 'flashcards') renderFlashcard();
        }

        // FLASHCARD LOGIC
        function renderFlashcard() {
            const inner = document.getElementById('flashcard-inner');
            inner.classList.remove('is-flipped'); // Always show front on change
            
            setTimeout(() => {
                document.getElementById('card-front').innerText = flashcards[cardIdx].q;
                document.getElementById('card-back').innerText = flashcards[cardIdx].a;
                document.getElementById('card-index').innerText = `${cardIdx + 1} / ${flashcards.length}`;
            }, 150);
        }

        function flipCard() { document.getElementById('flashcard-inner').classList.toggle('is-flipped'); }
        function nextCard() { cardIdx = (cardIdx + 1) % flashcards.length; renderFlashcard(); }
        function prevCard() { cardIdx = (cardIdx - 1 + flashcards.length) % flashcards.length; renderFlashcard(); }

        // CALENDAR LOGIC (Original from previous input)
        function changeView(v) {
            currentView = v; nav = 0;
            document.querySelectorAll('.view-switcher button').forEach(b => b.classList.remove('active'));
            document.getElementById(v + 'Btn').classList.add('active');
            render();
        }

        function changeDate(dir) { nav += dir; render(); }

        function render() {
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';
            grid.className = `calendar-grid grid-${currentView}`;
            
            const dt = new Date();
            if (currentView === 'month') dt.setMonth(new Date().getMonth() + nav);
            else if (currentView === 'week') dt.setDate(new Date().getDate() + (nav * 7));
            else dt.setDate(new Date().getDate() + nav);

            if (currentView === 'month') renderMonth(dt);
            else if (currentView === 'week') renderWeek(dt);
            else renderDay(dt);
        }

        function renderMonth(dt) {
            const month = dt.getMonth();
            const year = dt.getFullYear();
            const grid = document.getElementById('calGrid');
            document.getElementById('monthLabel').innerText = dt.toLocaleDateString('en-us', {month:'long', year:'numeric'});

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            ['S','M','T','W','T','F','S'].forEach(d => {
                const h = document.createElement('div'); h.className = 'day-header'; h.innerText = d; grid.appendChild(h);
            });

            for(let i=0; i<firstDay; i++) grid.appendChild(Object.assign(document.createElement('div'), {className:'day-box padding-day'}));
            for(let i=1; i<=daysInMonth; i++) {
                const d = document.createElement('div'); d.className = 'day-box';
                if(i === new Date().getDate() && nav === 0) d.classList.add('today');
                d.innerText = i; grid.appendChild(d);
            }
        }

        function renderWeek(dt) {
            const grid = document.getElementById('calGrid');
            const start = new Date(dt);
            start.setDate(dt.getDate() - dt.getDay());
            document.getElementById('monthLabel').innerText = "Week View";
            for(let i=0; i<7; i++) {
                const day = new Date(start); day.setDate(start.getDate() + i);
                const d = document.createElement('div'); d.className = 'day-box';
                if(day.toDateString() === new Date().toDateString()) d.classList.add('today');
                d.innerHTML = `<b>${day.toLocaleDateString('en-us',{weekday:'short'})}</b><br>${day.getDate()}`;
                grid.appendChild(d);
            }
        }

        function renderDay(dt) {
            const grid = document.getElementById('calGrid');
            document.getElementById('monthLabel').innerText = dt.toLocaleDateString('en-us', {weekday:'long', month:'short', day:'numeric'});
            const d = document.createElement('div'); d.className = 'day-box'; d.style.fontSize = '2rem'; d.innerText = dt.getDate();
            if(dt.toDateString() === new Date().toDateString()) d.classList.add('today');
            grid.appendChild(d);
        }

        render();
    </script>
</body>
</html>
