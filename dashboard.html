<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudyApp</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-purple: #6a11cb;
            --secondary-blue: #2575fc;
            --accent-yellow: #ffde59;
            --bg-light: #f4f7f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-light); height: 100vh; overflow: hidden; }
        .layout { display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, var(--primary-purple), var(--secondary-blue));
            color: white; padding: 30px; display: flex; flex-direction: column; flex-shrink: 0;
        }
        .sidebar h2 { margin-bottom: 40px; font-size: 1.5rem; letter-spacing: 1px; }
        .nav-item { 
            color: rgba(255,255,255,0.7); text-decoration: none; margin-bottom: 15px; 
            font-weight: 600; padding: 12px; border-radius: 8px; transition: 0.3s; cursor: pointer;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .content-section { display: none; height: 100%; overflow: hidden;}
        .content-section.active { display: flex; flex-direction: column; }

        /* Flashcard Studio Layout */
        .flashcard-studio { display: flex; height: 100%; gap: 20px; overflow: hidden; }
        .sets-sidebar {
            width: 280px; background: white; border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .sets-list { margin-top: 15px; overflow-y: auto; flex-grow: 1; }
        .set-item {
            padding: 15px; border-radius: 12px; background: #f8f9fa; margin-bottom: 10px;
            cursor: pointer; transition: 0.2s; border: 1px solid transparent;
        }
        .set-item:hover { border-color: var(--primary-purple); background: #f0f0ff; }
        
        .studio-main {
            flex: 1; background: white; border-radius: 20px; padding: 40px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        /* 3D Flashcard Styles */
        .card-scene {
            width: 400px;
            height: 250px;
            perspective: 1000px; /* Essential for 3D effect */
            margin: 20px auto;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Hides the back of the element when flipped */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card-face-front {
            background: white;
            color: var(--primary-purple);
            border: 2px solid #eee;
        }

        .card-face-back {
            background: linear-gradient(135deg, var(--primary-purple), var(--secondary-blue));
            color: white;
            transform: rotateY(180deg); /* Pre-flip the back side */
        }

        .plus-btn {
            background: var(--primary-purple);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .plus-btn:hover { transform: scale(1.1); }

        /* Calendar Card */
        .calendar-card {
            background: white; padding: 25px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: 100%;
            display: flex; flex-direction: column;
        }
        .cal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-shrink: 0;
        }
        .view-switcher button, .nav-btns button {
            padding: 8px 15px; border: 1px solid #ddd; background: white;
            cursor: pointer; border-radius: 6px; font-weight: 600;
        }
        .view-switcher button.active { background: var(--accent-yellow); border-color: var(--accent-yellow); }

        .calendar-grid { 
            display: grid; 
            gap: 10px; 
            flex-grow: 1; 
            width: 100%;
        }
        
        /* Grid states handled via JS class switching */
        .grid-month { grid-template-columns: repeat(7, 1fr); grid-template-rows: 30px repeat(6, 1fr); }
        .grid-week { grid-template-columns: repeat(7, 1fr); grid-template-rows: 1fr; }
        .grid-day { grid-template-columns: 1fr; grid-template-rows: 1fr; }

        .day-box {
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;      /* Keeps text centered horizontally */
            justify-content: flex-start; /* Pushes content to the TOP instead of center */
            font-size: 1rem;
            background: #fff;
            padding: 10px 5px 5px 5px; /* Added more padding to the TOP (10px) */
            height: 100%;             /* Ensures the box fills the grid cell */
        }
        .day-header { font-weight: bold; color: #999; font-size: 0.85rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
        .today { background: #fff9e6; border: 2px solid var(--accent-yellow); color: #333; font-weight: bold; }
        .padding-day { opacity: 0.3; background: #fafafa; }
        
        /* Modal Styles */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 500px; }
    </style>
</head>
<body>

    <div class="layout">
        <nav class="sidebar">
            <h2>STUDYAPP</h2>
            <div id="nav-dashboard" class="nav-item active" onclick="showSection('dashboard')">🏠 Dashboard</div>
            <div id="nav-calendar" class="nav-item" onclick="showSection('calendar')">📅 Calendar</div>
            <div id="nav-flashcards" class="nav-item" onclick="showSection('flashcards')">🃏 Flashcards</div>
            <a href="index.html" class="nav-item logout-btn" style="margin-top: auto; color: #ffb3b3;">🚪 Log Out</a>
        </nav>

        <main class="main-content">
            <div id="dashboard" class="content-section active">
                <div style="background: white; padding: 30px; border-radius: 20px;">
                    <h1>Welcome Back!</h1>
                    <p>Select a tool from the sidebar to begin.</p>
                </div>
            </div>

            <div id="calendar" class="content-section">
                <div class="calendar-card">
                    <div class="cal-header">
                        <div class="view-switcher">
                            <button id="dayBtn" onclick="changeView('day')">Day</button>
                            <button id="weekBtn" onclick="changeView('week')">Week</button>
                            <button id="monthBtn" class="active" onclick="changeView('month')">Month</button>
                        </div>
                        <h2 id="monthLabel">Month Year</h2>
                        <div class="nav-btns">
                            <button onclick="changeDate(-1)">Prev</button>
                            <button onclick="changeDate(1)">Next</button>
                        </div>
                    </div>
                    <div id="calGrid" class="calendar-grid grid-month"></div>
                </div>
            </div>

            <div id="flashcards" class="content-section">
                <div class="flashcard-studio">
                    <aside class="sets-sidebar">
                        <h3>Saved Sets</h3>
                        <div class="sets-list" id="saved-sets-list"></div>
                    </aside>
                    <section class="studio-main">
                        <div id="creation-ui" style="text-align: center;">
                            <h2>Make a new set</h2>
                            <button class="plus-btn" onclick="openModal()">  +  </button>
                        </div>
                        <div id="player-ui" style="display:none; text-align:center; width:100%;">
                            <h3 id="active-set-title" style="margin-bottom:20px;">Set Title</h3>
    
                            <div class="card-scene" onclick="document.getElementById('card-inner').classList.toggle('is-flipped')">
                                <div class="card-inner" id="card-inner">
                                    <div class="card-face card-face-front" id="f-front">Question</div>
                                    <div class="card-face card-face-back" id="f-back">Answer</div>
                                </div>
                            </div>
                            <div style="display:flex; gap:15px; justify-content:center; align-items:center; margin-top: 20px;">
                                <button onclick="prevC()" class="view-switcher button">Prev</button>
                                <span id="c-count" style="font-weight: bold; min-width: 60px;">1 / 1</span>
                                <button onclick="nextC()" class="view-switcher button">Next</button>
                            </div>

                            <div style="margin-top: 25px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
                                <button onclick="shuffleDeck()" class="view-switcher button" style="background: #eef2ff; width: 120px;">🔀 Shuffle</button>
                            </div>
    
                            <button onclick="exitPlayer()" style="margin-top:20px; color:#999; border:none; background:none; cursor:pointer; font-weight:600;">Close Player</button>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <div id="createModal" class="modal">
        <div class="modal-content">
            <h3>Create New Set</h3>
            <input type="text" id="set-title" placeholder="Set Title (e.g. Biology 101)" style="width:100%; padding:10px; margin:15px 0; border-radius:8px; border:1px solid #ddd;">
            <div id="cards-input-area">
                <div style="display:flex; gap:5px; margin: 0 auto 10px auto; max-width: 750px;">
                    <input type="text" placeholder="Question" class="q-in" style="flex:1; padding:8px;">
                    <input type="text" placeholder="Answer" class="a-in" style="flex:1; padding:8px;">
                </div>
            </div>
            <button onclick="addNewInputRow()" style="background:#eee; border:none; padding:8px; width:100%; cursor:pointer; margin-bottom:15px;">+ Add Another Card</button>
            <div style="display:flex; gap:10px;">
                <button onclick="saveSet()" style="flex:1; background:var(--primary-purple); color:white; border:none; padding:12px; border-radius:8px; cursor:pointer;">Save Set</button>
                <button onclick="closeModal()" style="flex:1; background:#ccc; border:none; padding:12px; border-radius:8px; cursor:pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let nav = 0; 
        let currentView = 'month';
        let activeDeck = []; 
        let cIdx = 0;
        let editingSetId = null; // Keeps track of which set we are editing

        // Replace these with your actual details from the Supabase dashboard
        let supabaseUrl = 'REPLACE_WITH_SUPABASE_URL'; 
        let supabaseKey = 'REPLACE_WITH_SUPABASE_KEY';

        // This line uses those variables to create the connection
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('nav-'+id).classList.add('active');
            if(id === 'calendar') render();
            if(id === 'flashcards') loadSets(); // Load data when clicking the tab
        }

        /* --- CALENDAR LOGIC --- */
        function changeView(v) {
            currentView = v; 
            nav = 0; // Reset navigation when switching views
            document.querySelectorAll('.view-switcher button').forEach(b => b.classList.remove('active'));
            document.getElementById(v + 'Btn').classList.add('active');
            render();
        }

        function changeDate(dir) {
            nav += dir;
            render();
        }

        function render() {
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';
            grid.className = `calendar-grid grid-${currentView}`;
            
            const dt = new Date();
            
            if (currentView === 'month') {
                dt.setMonth(new Date().getMonth() + nav);
                renderMonth(dt);
            } else if (currentView === 'week') {
                dt.setDate(new Date().getDate() + (nav * 7));
                renderWeek(dt);
            } else {
                dt.setDate(new Date().getDate() + nav);
                renderDay(dt);
            }
        }

        function renderMonth(dt) {
            const grid = document.getElementById('calGrid');
            const month = dt.getMonth();
            const year = dt.getFullYear();
            
            document.getElementById('monthLabel').innerText = dt.toLocaleDateString('en-us', {month:'long', year:'numeric'});

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Render Weekday Headers
            ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(day => {
                const h = document.createElement('div');
                h.className = 'day-header';
                h.innerText = day;
                grid.appendChild(h);
            });

            // Padding days
            for(let i=0; i < firstDayOfMonth; i++) {
                const p = document.createElement('div');
                p.className = 'day-box padding-day';
                grid.appendChild(p);
            }

            // Days of the month
            for(let i=1; i <= daysInMonth; i++) {
                const dayBox = document.createElement('div');
                dayBox.className = 'day-box';
                const isToday = i === new Date().getDate() && dt.getMonth() === new Date().getMonth() && dt.getFullYear() === new Date().getFullYear();
                if(isToday) dayBox.classList.add('today');
                dayBox.innerText = i;
                grid.appendChild(dayBox);
            }
        }

        function renderWeek(dt) {
            const grid = document.getElementById('calGrid');
            const startOfWeek = new Date(dt);
            startOfWeek.setDate(dt.getDate() - dt.getDay());
            
            document.getElementById('monthLabel').innerText = `Week of ${startOfWeek.toLocaleDateString('en-us', {month:'short', day:'numeric'})}`;
            
            for(let i=0; i<7; i++) {
                const day = new Date(startOfWeek);
                day.setDate(startOfWeek.getDate() + i);
                
                const dayBox = document.createElement('div');
                dayBox.className = 'day-box';
                if(day.toDateString() === new Date().toDateString()) dayBox.classList.add('today');
                
                dayBox.innerHTML = `<span style="font-size:0.8rem; color:#999; font-weight:bold">${day.toLocaleDateString('en-us',{weekday:'short'})}</span>
                                    <span style="font-size:1.8rem">${day.getDate()}</span>`;
                grid.appendChild(dayBox);
            }
        }

        function renderDay(dt) {
            const grid = document.getElementById('calGrid');
            document.getElementById('monthLabel').innerText = dt.toLocaleDateString('en-us', {weekday:'long', month:'long', day:'numeric'});
            
            const dayBox = document.createElement('div');
            dayBox.className = 'day-box';
            dayBox.innerHTML = `<span style="font-size:4rem">${dt.getDate()}</span>
                                <span style="color:#666">${dt.toLocaleDateString('en-us', {month: 'long'})}</span>`;
            if(dt.toDateString() === new Date().toDateString()) dayBox.classList.add('today');
            
            grid.appendChild(dayBox);
        }
        // --- FLASHCARD LOGIC ---
        async function loadSets() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) return;

    const { data, error } = await _supabase
        .from('flashcard_sets')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

    if (error) return console.error("Error:", error);

    const list = document.getElementById('saved-sets-list');
    if (data.length === 0) {
        list.innerHTML = '<p style="color:#999; padding:10px;">No sets found.</p>';
        return;
    }

    list.innerHTML = data.map(set => `
        <div class="set-item" style="position:relative;">
            <div onclick='startPlaying(${JSON.stringify(set.cards).replace(/'/g, "&apos;")}, "${set.title}")'>
                <h4>${set.title}</h4>
                <span>${set.cards.length} cards</span>
            </div>
            <div style="margin-top:10px; display:flex; gap:10px;">
                <button onclick='editSet(${JSON.stringify(set).replace(/'/g, "&apos;")})' style="font-size:0.8rem; cursor:pointer; background:none; border:1px solid #ddd; border-radius:4px; padding:2px 8px;">Edit</button>
                <button onclick='deleteSet("${set.id}")' style="font-size:0.8rem; cursor:pointer; background:none; border:1px solid #ffb3b3; color:red; border-radius:4px; padding:2px 8px;">Delete</button>
            </div>
        </div>
    `).join('');
}
        function editSet(set) {
    editingSetId = set.id; // Store the ID so we know we're editing
    document.getElementById('set-title').value = set.title;
    
    const container = document.getElementById('cards-input-area');
    container.innerHTML = ''; // Clear existing rows

    set.cards.forEach(card => {
        const div = document.createElement('div');
        div.style.display='flex'; div.style.gap='5px'; div.style.marginBottom='10px';
        div.innerHTML = `
            <input type="text" value="${card.q}" class="q-in" style="flex:1; padding:8px;">
            <input type="text" value="${card.a}" class="a-in" style="flex:1; padding:8px;">
        `;
        container.appendChild(div);
    });

    openModal();
}

        async function saveSet() {
    const { data: { user } } = await _supabase.auth.getUser();
    const title = document.getElementById('set-title').value;
    const qs = document.querySelectorAll('.q-in');
    const as = document.querySelectorAll('.a-in');
    const cards = [];
    
    qs.forEach((q, i) => { 
        if(q.value.trim()) cards.push({q: q.value, a: as[i].value}); 
    });

    if(!title || cards.length === 0) return alert("Title and cards required");

    let error;
    if (editingSetId) {
        // Update existing
        const result = await _supabase
            .from('flashcard_sets')
            .update({ title, cards })
            .eq('id', editingSetId);
        error = result.error;
    } else {
        // Insert new
        const result = await _supabase
            .from('flashcard_sets')
            .insert([{ user_id: user.id, title, cards }]);
        error = result.error;
    }

    if(!error) { 
        editingSetId = null; // Reset
        closeModal(); 
        loadSets(); 
        // Clear inputs...
    } else { 
        alert(error.message); 
    }
}

        async function deleteSet(setId) {
    if (!confirm("Are you sure you want to delete this set? This cannot be undone.")) return;

    const { error } = await _supabase
        .from('flashcard_sets')
        .delete()
        .eq('id', setId);

    if (!error) {
        loadSets(); // Refresh the list
    } else {
        alert("Error deleting set: " + error.message);
    }
}

        function startPlaying(cards, title) {
            activeDeck = cards; 
            cIdx = 0;
            document.getElementById('creation-ui').style.display = 'none';
            document.getElementById('player-ui').style.display = 'block';
            document.getElementById('active-set-title').innerText = title;
            updateCardDisplay();
        }

        function shuffleDeck() {
            if (activeDeck.length < 2) return;

            // Fisher-Yates Shuffle Algorithm
            for (let i = activeDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [activeDeck[i], activeDeck[j]] = [activeDeck[j], activeDeck[i]];
            }

            // Reset to the first card of the new shuffled order
            cIdx = 0;
    
            // Visual feedback: briefly shrink the card to show it's being shuffled
            const card = document.getElementById('card-inner');
            card.style.transform = "scale(0.8)";
    
            setTimeout(() => {
                updateCardDisplay();
                card.style.transform = ""; // Reset scale
            }, 200);
        }

        function updateCardDisplay() {
            document.getElementById('card-inner').classList.remove('is-flipped');
            document.getElementById('f-front').innerText = activeDeck[cIdx].q;
            document.getElementById('f-back').innerText = activeDeck[cIdx].a;
            document.getElementById('c-count').innerText = `${cIdx + 1} / ${activeDeck.length}`;
        }

        function nextC() { cIdx = (cIdx + 1) % activeDeck.length; updateCardDisplay(); }
        function prevC() { cIdx = (cIdx - 1 + activeDeck.length) % activeDeck.length; updateCardDisplay(); }
        function exitPlayer() { document.getElementById('creation-ui').style.display = 'block'; document.getElementById('player-ui').style.display = 'none'; }
        
        function openModal() { document.getElementById('createModal').style.display = 'flex'; }
        function closeModal() {
    document.getElementById('createModal').style.display = 'none';
    editingSetId = null;
    document.getElementById('set-title').value = '';
    document.getElementById('cards-input-area').innerHTML = `
        <div style="display:flex; gap:5px; margin-bottom:10px;">
            <input type="text" placeholder="Question" class="q-in" style="flex:1; padding:8px;">
            <input type="text" placeholder="Answer" class="a-in" style="flex:1; padding:8px;">
        </div>`;
}
        
        function addNewInputRow() {
            const div = document.createElement('div'); 
            div.style.display='flex'; div.style.gap='5px'; div.style.marginBottom='10px';
            div.innerHTML = `<input type="text" placeholder="Question" class="q-in" style="flex:1; padding:8px;"><input type="text" placeholder="Answer" class="a-in" style="flex:1; padding:8px;">`;
            document.getElementById('cards-input-area').appendChild(div);
        }

        // Initialize
        render();
    </script>
</body>
</html>
