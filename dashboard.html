<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - StudyApp</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-purple: #6a11cb;
            --secondary-blue: #2575fc;
            --accent-yellow: #ffde59;
            --bg-light: #f4f7f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-light); height: 100vh; overflow: hidden; }
        .layout { display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, var(--primary-purple), var(--secondary-blue));
            color: white; padding: 30px; display: flex; flex-direction: column; flex-shrink: 0;
        }
        .sidebar h2 { margin-bottom: 40px; font-size: 1.5rem; letter-spacing: 1px; }
        .nav-item { 
            color: rgba(255,255,255,0.7); text-decoration: none; margin-bottom: 15px; 
            font-weight: 600; padding: 12px; border-radius: 8px; transition: 0.3s; cursor: pointer;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .content-section { display: none; height: 100%; overflow: hidden;}
        .content-section.active { display: flex; flex-direction: column; }

        /* Flashcard Studio Layout */
        .flashcard-studio { display: flex; height: 100%; gap: 20px; overflow: hidden; }
        .sets-sidebar {
            width: 280px; background: white; border-radius: 20px; padding: 20px;
            display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .sets-list { margin-top: 15px; overflow-y: auto; flex-grow: 1; }
        .set-item {
            padding: 15px; border-radius: 12px; background: #f8f9fa; margin-bottom: 10px;
            cursor: pointer; transition: 0.2s; border: 1px solid transparent;
        }
        .set-item:hover { border-color: var(--primary-purple); background: #f0f0ff; }
        
        .studio-main {
            flex: 1; background: white; border-radius: 20px; padding: 40px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Calendar Card */
        .calendar-card {
            background: white; padding: 25px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); height: 100%;
            display: flex; flex-direction: column;
        }
        .cal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-shrink: 0;
        }
        .view-switcher button, .nav-btns button {
            padding: 8px 15px; border: 1px solid #ddd; background: white;
            cursor: pointer; border-radius: 6px; font-weight: 600;
        }
        .view-switcher button.active { background: var(--accent-yellow); border-color: var(--accent-yellow); }

        .calendar-grid { 
            display: grid; 
            gap: 10px; 
            flex-grow: 1; 
            width: 100%;
        }
        
        /* Grid states handled via JS class switching */
        .grid-month { grid-template-columns: repeat(7, 1fr); grid-template-rows: 30px repeat(6, 1fr); }
        .grid-week { grid-template-columns: repeat(7, 1fr); grid-template-rows: 1fr; }
        .grid-day { grid-template-columns: 1fr; grid-template-rows: 1fr; }

        .day-box {
            border: 1px solid #f0f0f0; border-radius: 12px; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            font-size: 1.1rem; background: #fff; padding: 10px; transition: 0.2s;
        }
        .day-header { font-weight: bold; color: #999; font-size: 0.85rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
        .today { background: #fff9e6; border: 2px solid var(--accent-yellow); color: #333; font-weight: bold; }
        .padding-day { opacity: 0.3; background: #fafafa; }
        
        /* Modal Styles */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 450px; }
    </style>
</head>
<body>

    <div class="layout">
        <nav class="sidebar">
            <h2>STUDYAPP</h2>
            <div id="nav-dashboard" class="nav-item active" onclick="showSection('dashboard')">🏠 Dashboard</div>
            <div id="nav-calendar" class="nav-item" onclick="showSection('calendar')">📅 Calendar</div>
            <div id="nav-flashcards" class="nav-item" onclick="showSection('flashcards')">🃏 Flashcards</div>
            <a href="index.html" class="nav-item logout-btn" style="margin-top: auto; color: #ffb3b3;">🚪 Log Out</a>
        </nav>

        <main class="main-content">
            <div id="dashboard" class="content-section active">
                <div style="background: white; padding: 30px; border-radius: 20px;">
                    <h1>Welcome Back!</h1>
                    <p>Select a tool from the sidebar to begin.</p>
                </div>
            </div>

            <div id="calendar" class="content-section">
                <div class="calendar-card">
                    <div class="cal-header">
                        <div class="view-switcher">
                            <button id="dayBtn" onclick="changeView('day')">Day</button>
                            <button id="weekBtn" onclick="changeView('week')">Week</button>
                            <button id="monthBtn" class="active" onclick="changeView('month')">Month</button>
                        </div>
                        <h2 id="monthLabel">Month Year</h2>
                        <div class="nav-btns">
                            <button onclick="changeDate(-1)">Prev</button>
                            <button onclick="changeDate(1)">Next</button>
                        </div>
                    </div>
                    <div id="calGrid" class="calendar-grid grid-month"></div>
                </div>
            </div>

            <div id="flashcards" class="content-section">
                <div class="flashcard-studio">
                    <aside class="sets-sidebar">
                        <h3>Your Sets</h3>
                        <div class="sets-list" id="saved-sets-list">
                            <p style="color:#999; font-size: 0.9rem;">No sets saved yet.</p>
                        </div>
                    </aside>
                    <section class="studio-main">
                        <h2>Flashcards ready soon!</h2>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script>
        let nav = 0; 
        let currentView = 'month';

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('nav-'+id).classList.add('active');
            if(id === 'calendar') render();
        }

        /* --- CALENDAR LOGIC --- */
        function changeView(v) {
            currentView = v; 
            nav = 0; // Reset navigation when switching views
            document.querySelectorAll('.view-switcher button').forEach(b => b.classList.remove('active'));
            document.getElementById(v + 'Btn').classList.add('active');
            render();
        }

        function changeDate(dir) {
            nav += dir;
            render();
        }

        function render() {
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';
            grid.className = `calendar-grid grid-${currentView}`;
            
            const dt = new Date();
            
            if (currentView === 'month') {
                dt.setMonth(new Date().getMonth() + nav);
                renderMonth(dt);
            } else if (currentView === 'week') {
                dt.setDate(new Date().getDate() + (nav * 7));
                renderWeek(dt);
            } else {
                dt.setDate(new Date().getDate() + nav);
                renderDay(dt);
            }
        }

        function renderMonth(dt) {
            const grid = document.getElementById('calGrid');
            const month = dt.getMonth();
            const year = dt.getFullYear();
            
            document.getElementById('monthLabel').innerText = dt.toLocaleDateString('en-us', {month:'long', year:'numeric'});

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Render Weekday Headers
            ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(day => {
                const h = document.createElement('div');
                h.className = 'day-header';
                h.innerText = day;
                grid.appendChild(h);
            });

            // Padding days
            for(let i=0; i < firstDayOfMonth; i++) {
                const p = document.createElement('div');
                p.className = 'day-box padding-day';
                grid.appendChild(p);
            }

            // Days of the month
            for(let i=1; i <= daysInMonth; i++) {
                const dayBox = document.createElement('div');
                dayBox.className = 'day-box';
                const isToday = i === new Date().getDate() && dt.getMonth() === new Date().getMonth() && dt.getFullYear() === new Date().getFullYear();
                if(isToday) dayBox.classList.add('today');
                dayBox.innerText = i;
                grid.appendChild(dayBox);
            }
        }

        function renderWeek(dt) {
            const grid = document.getElementById('calGrid');
            const startOfWeek = new Date(dt);
            startOfWeek.setDate(dt.getDate() - dt.getDay());
            
            document.getElementById('monthLabel').innerText = `Week of ${startOfWeek.toLocaleDateString('en-us', {month:'short', day:'numeric'})}`;
            
            for(let i=0; i<7; i++) {
                const day = new Date(startOfWeek);
                day.setDate(startOfWeek.getDate() + i);
                
                const dayBox = document.createElement('div');
                dayBox.className = 'day-box';
                if(day.toDateString() === new Date().toDateString()) dayBox.classList.add('today');
                
                dayBox.innerHTML = `<span style="font-size:0.8rem; color:#999; font-weight:bold">${day.toLocaleDateString('en-us',{weekday:'short'})}</span>
                                    <span style="font-size:1.8rem">${day.getDate()}</span>`;
                grid.appendChild(dayBox);
            }
        }

        function renderDay(dt) {
            const grid = document.getElementById('calGrid');
            document.getElementById('monthLabel').innerText = dt.toLocaleDateString('en-us', {weekday:'long', month:'long', day:'numeric'});
            
            const dayBox = document.createElement('div');
            dayBox.className = 'day-box';
            dayBox.innerHTML = `<span style="font-size:4rem">${dt.getDate()}</span>
                                <span style="color:#666">${dt.toLocaleDateString('en-us', {month: 'long'})}</span>`;
            if(dt.toDateString() === new Date().toDateString()) dayBox.classList.add('today');
            
            grid.appendChild(dayBox);
        }

        // Initialize
        render();
    </script>
</body>
</html>
