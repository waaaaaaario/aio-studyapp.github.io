<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study App - Clean Calendar</title>
    <style>
        :root {
            --primary-yellow: #ffde59;
            --hover-yellow: #fbd01e;
            --bg-gray: #f8f9fa;
            --text-dark: #1a1a1b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-gray); 
            padding: 20px; 
            color: var(--text-dark);
        }

        .back-link { 
            display: inline-block; 
            margin-bottom: 20px; 
            color: #666; 
            text-decoration: none; 
            font-weight: 600;
        }

        .calendar-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .view-switcher button, .nav-buttons button {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 12px;
            font-weight: 700;
            transition: 0.3s;
        }

        .view-switcher button.active {
            background: var(--primary-yellow);
            border-color: var(--primary-yellow);
        }

        #monthDisplay { font-size: 1.8rem; font-weight: 900; }

        .calendar-grid {
            display: grid;
            gap: 12px;
        }

        .grid-month, .grid-week { grid-template-columns: repeat(7, 1fr); }
        .grid-day { grid-template-columns: 1fr; }

        .day-header { 
            font-weight: bold; 
            color: #aaa; 
            text-transform: uppercase; 
            font-size: 0.75rem; 
            text-align: center;
        }
        
        .day-box {
            min-height: 120px;
            border: 1px solid #f0f0f0;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            text-align: center;
        }

        /* Today Highlight (Works in all views) */
        .today { 
            background-color: var(--primary-yellow) !important; 
            border-color: var(--primary-yellow) !important;
            box-shadow: 0 4px 12px rgba(255, 222, 89, 0.4);
        }

        .day-title { font-weight: 800; font-size: 1.2rem; }
        .day-subtitle { font-size: 0.8rem; color: #888; margin-top: 4px; }

        .padding-day { background-color: #fafafa; opacity: 0.3; }

        @media (max-width: 768px) {
            .grid-week { grid-template-columns: 1fr; }
            #monthDisplay { font-size: 1.4rem; width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Return Home</a>
    
    <div class="calendar-container">
        <div class="header-controls">
            <div class="view-switcher">
                <button id="dayBtn" onclick="changeView('day')">Day</button>
                <button id="weekBtn" onclick="changeView('week')">Week</button>
                <button id="monthBtn" class="active" onclick="changeView('month')">Month</button>
            </div>

            <div id="monthDisplay"></div>

            <div class="nav-buttons">
                <button onclick="moveTime(-1)">Prev</button>
                <button onclick="moveTime(1)">Next</button>
            </div>
        </div>

        <div id="calendarGrid" class="calendar-grid grid-month"></div>
    </div>

    <script>
        let nav = 0; 
        let view = 'month';
        const calendarGrid = document.getElementById('calendarGrid');
        const monthDisplay = document.getElementById('monthDisplay');

        function render() {
            const dt = new Date();
            // Adjust date based on navigation
            if (nav !== 0) {
                if (view === 'month') dt.setMonth(new Date().getMonth() + nav);
                else if (view === 'week') dt.setDate(new Date().getDate() + (nav * 7));
                else dt.setDate(new Date().getDate() + nav);
            }

            calendarGrid.innerHTML = '';
            calendarGrid.className = 'calendar-grid';

            if (view === 'month') renderMonthView(dt);
            else if (view === 'week') renderWeekView(dt);
            else renderDayView(dt);
        }

        function isToday(date) {
            const today = new Date();
            return date.getDate() === today.getDate() &&
                   date.getMonth() === today.getMonth() &&
                   date.getFullYear() === today.getFullYear();
        }

        function renderMonthView(dt) {
            calendarGrid.classList.add('grid-month');
            const year = dt.getFullYear();
            const month = dt.getMonth();
            monthDisplay.innerText = dt.toLocaleDateString('en-us', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(d => {
                const h = document.createElement('div');
                h.className = 'day-header';
                h.innerText = d;
                calendarGrid.appendChild(h);
            });

            for(let i = 0; i < firstDay; i++) {
                const p = document.createElement('div');
                p.className = 'day-box padding-day';
                calendarGrid.appendChild(p);
            }

            for(let i = 1; i <= daysInMonth; i++) {
                const dateObj = new Date(year, month, i);
                const d = document.createElement('div');
                d.className = 'day-box';
                if (isToday(dateObj)) d.classList.add('today');
                d.innerHTML = `<div class="day-title">${i}</div>`;
                calendarGrid.appendChild(d);
            }
        }

        function renderWeekView(dt) {
            calendarGrid.classList.add('grid-week');
            const startOfWeek = new Date(dt);
            startOfWeek.setDate(dt.getDate() - dt.getDay());
            
            monthDisplay.innerText = "Week View";

            for(let i = 0; i < 7; i++) {
                const day = new Date(startOfWeek);
                day.setDate(startOfWeek.getDate() + i);
                
                const box = document.createElement('div');
                box.className = 'day-box';
                if (isToday(day)) box.classList.add('today');
                
                box.innerHTML = `
                    <div class="day-title">${day.getDate()}</div>
                    <div class="day-subtitle">${day.toLocaleDateString('en-us', { weekday: 'short' })}</div>
                `;
                calendarGrid.appendChild(box);
            }
        }

        function renderDayView(dt) {
            calendarGrid.classList.add('grid-day');
            monthDisplay.innerText = dt.toLocaleDateString('en-us', { weekday: 'long', month: 'long', day: 'numeric' });
            
            const box = document.createElement('div');
            box.className = 'day-box';
            box.style.minHeight = '300px';
            if (isToday(dt)) box.classList.add('today');
            
            box.innerHTML = `<div class="day-title" style="font-size: 3rem;">${dt.getDate()}</div>`;
            calendarGrid.appendChild(box);
        }

        function moveTime(dir) {
            nav += dir;
            render();
        }

        function changeView(newView) {
            view = newView;
            nav = 0; 
            document.querySelectorAll('.view-switcher button').forEach(b => b.classList.remove('active'));
            document.getElementById(newView + 'Btn').classList.add('active');
            render();
        }

        render();
    </script>
</body>
</html>
