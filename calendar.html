<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Calendar - Dynamic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; text-align: center; }
        
        .back-link { display: inline-block; margin-bottom: 20px; color: #555; text-decoration: none; font-weight: bold; }
        
        .calendar-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* View & Navigation Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .view-switcher button, .nav-buttons button {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.2s;
        }

        .view-switcher button.active { background: #ffde59; border-color: #ffde59; }
        .nav-buttons button:hover { background: #eee; }

        #monthDisplay { font-size: 1.5rem; font-weight: 800; min-width: 200px; }

        /* Grid Setup */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day-header { font-weight: bold; color: #999; text-transform: uppercase; font-size: 0.8rem; padding-bottom: 10px; }
        
        .day {
            aspect-ratio: 1/1;
            border: 1px solid #f0f0f0;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #444;
            transition: 0.2s;
        }

        .day:hover { background-color: #fffde7; border-color: #ffde59; cursor: pointer; }
        .padding-day { background-color: #fafafa; color: #ccc; border: none; }
        .today { background-color: #ffde59; font-weight: bold; border-color: #ffde59; }

        /* Responsive */
        @media (max-width: 600px) {
            .controls { justify-content: center; }
            #monthDisplay { width: 100%; order: -1; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Back to Dashboard</a>
    
    <div class="calendar-container">
        <div class="controls">
            <div class="view-switcher">
                <button onclick="changeView('day')">Day</button>
                <button onclick="changeView('week')">Week</button>
                <button class="active" onclick="changeView('month')">Month</button>
            </div>

            <div id="monthDisplay"></div>

            <div class="nav-buttons">
                <button onclick="moveMonth(-1)">Prev</button>
                <button onclick="moveMonth(1)">Next</button>
            </div>
        </div>

        <div id="calendarGrid" class="calendar-grid">
            </div>
    </div>

    <script>
        let nav = 0; // Tracks which month we are looking at (0 = current)
        const calendarGrid = document.getElementById('calendarGrid');
        const monthDisplay = document.getElementById('monthDisplay');

        function loadCalendar() {
            const dt = new Date();
            if (nav !== 0) {
                dt.setMonth(new Date().getMonth() + nav);
            }

            const day = dt.getDate();
            const month = dt.getMonth();
            const year = dt.getFullYear();

            const firstDayOfMonth = new Date(year, month, 1);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            const dateString = firstDayOfMonth.toLocaleDateString('en-us', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
            });

            const padDays = firstDayOfMonth.getDay();

            monthDisplay.innerText = `${dt.toLocaleDateString('en-us', { month: 'long' })} ${year}`;
            calendarGrid.innerHTML = '';

            // Add Headers
            const weekDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            weekDays.forEach(d => {
                const daySq = document.createElement('div');
                daySq.classList.add('day-header');
                daySq.innerText = d;
                calendarGrid.appendChild(daySq);
            });

            // Add Padding Days (empty days from previous month)
            for(let i = 1; i <= padDays; i++) {
                const daySq = document.createElement('div');
                daySq.classList.add('day', 'padding-day');
                calendarGrid.appendChild(daySq);
            }

            // Add Actual Days
            for(let i = 1; i <= daysInMonth; i++) {
                const daySq = document.createElement('div');
                daySq.classList.add('day');
                daySq.innerText = i;

                if (i === new Date().getDate() && nav === 0) {
                    daySq.classList.add('today');
                }

                calendarGrid.appendChild(daySq);
            }
        }

        function moveMonth(dir) {
            nav += dir;
            loadCalendar();
        }

        function changeView(view) {
            alert("Switching to " + view + " view! (This would trigger a different layout in a full app)");
            // Note: For a real app, this would swap the grid for a single-day or 7-day view.
        }

        loadCalendar();
    </script>
</body>
</html>
