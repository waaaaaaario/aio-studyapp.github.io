<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Calendar</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background-color: #f9f9f9; text-align: center; }
        .back-link { display: block; margin-bottom: 20px; color: #666; text-decoration: none; }
        
        .calendar-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .day-label { font-weight: bold; padding: 10px; color: #888; }
        
        .day {
            aspect-ratio: 1 / 1;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
        }

        .day:hover { background-color: #fff9db; border-color: #ffde59; }
        .today { background-color: #ffde59; font-weight: bold; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Back to Home</a>
    
    <div class="calendar-container">
        <h1>February 2026</h1>
        <div class="calendar-grid">
            <div class="day-label">Sun</div><div class="day-label">Mon</div>
            <div class="day-label">Tue</div><div class="day-label">Wed</div>
            <div class="day-label">Thu</div><div class="day-label">Fri</div>
            <div class="day-label">Sat</div>

            <div class="day">1</div><div class="day">2</div><div class="day">3</div>
            <div class="day">4</div><div class="day">5</div><div class="day">6</div>
            <div class="day">7</div><div class="day">8</div><div class="day">9</div>
            <div class="day">10</div><div class="day">11</div><div class="day">12</div>
            <div class="day">13</div><div class="day">14</div><div class="day">15</div>
            <div class="day today">16</div> <div class="day">17</div><div class="day">18</div><div class="day">19</div>
            <div class="day">20</div><div class="day">21</div><div class="day">22</div>
            <div class="day">23</div><div class="day">24</div><div class="day">25</div>
            <div class="day">26</div><div class="day">27</div><div class="day">28</div>
        </div>
    </div>

</body>
</html>
