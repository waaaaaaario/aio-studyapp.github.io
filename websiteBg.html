<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study App Landing Page</title>
    <style>
        /* Removes default browser margins */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
        }

        /* Container for the background image */
        .bg-container {
            /* Replace 'your-image-url.jpg' with your actual image path or URL */
            background-image: url('your-image-url.jpg');
            background-color: #f4f4f4; /* Fallback color if image doesn't load */
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            
            /* Centers the text inside the container */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Styling for the bold text */
        .hero-text {
            font-size: 4rem;
            font-weight: 800; /* Extra Bold */
            color: #333;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Optional: subtle shadow to make text pop against the background */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <h1 class="hero-text">All In One Study App</h1>
    </div>

</body>
</html>
