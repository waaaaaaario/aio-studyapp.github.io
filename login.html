<script>
    document.querySelector('form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const usernameInput = document.querySelector('input[type="text"]').value;
        const passwordInput = document.querySelector('input[type="password"]').value;

        try {
            // 1. Fetch the "database" file from your repository
            const response = await fetch('users.json');
            const officialUsers = await response.json();

            // 2. Also get any local users (the ones who signed up in this browser)
            const localUsers = JSON.parse(localStorage.getItem('studyAppUsers')) || [];

            // 3. Combine both lists
            const allUsers = [...officialUsers, ...localUsers];

            // 4. Check for a match
            const validUser = allUsers.find(u => 
                u.username === usernameInput && u.password === passwordInput
            );

            if (validUser) {
                localStorage.setItem('loggedInUser', validUser.username);
                window.location.href = 'dashboard.html';
            } else {
                alert("Invalid credentials. Note: New signups are only saved to this browser!");
            }
        } catch (error) {
            console.error("Error loading user file:", error);
            alert("Could not connect to the user database.");
        }
    });
</script>
