<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - StudyApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 2rem;
        }

        .login-card p {
            color: #777;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #6a11cb;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #6a11cb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #2575fc;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            color: #6a11cb;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .back-home:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Sign in to access your dashboard.</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" id="loginBtn" class="btn-login">Sign In</button>
        </form>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
    apiKey: "SEARCH_REPLACE_API_KEY",
    authDomain: "SEARCH_REPLACE_AUTH_DOMAIN",
    projectId: "SEARCH_REPLACE_PROJECT_ID",
    storageBucket: "SEARCH_REPLACE_STORAGE_BUCKET",
    messagingSenderId: "SEARCH_REPLACE_SENDER_ID",
    appId: "SEARCH_REPLACE_APP_ID"
};


        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Visual feedback
            loginBtn.innerText = "Verifying...";
            loginBtn.disabled = true;

            // 1. Firebase Sign In
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Success!
                    const user = userCredential.user;
                    console.log("Logged in:", user.email);
                    
                    // Save to local storage for the dashboard greeting
                    localStorage.setItem('loggedInUser', user.email);
                    
                    window.location.href = 'dashboard.html';
                })
                .catch((error) => {
                    // Handle Errors
                    alert("Login failed: " + error.message);
                    
                    // Reset button
                    loginBtn.innerText = "Sign In";
                    loginBtn.disabled = false;
                });
        });
    </script>

</body>
</html>
