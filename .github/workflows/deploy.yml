name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main  # Check if your branch is 'main' or 'master'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Inject Supabase Secrets
        run: |
          # We use | as a delimiter in sed because URLs contain / which breaks normal sed
          sed -i "s|SEARCH_REPLACE_SUPABASE_URL|${{ secrets.SUPABASE_URL }}|g" signup.html
          sed -i "s|SEARCH_REPLACE_SUPABASE_KEY|${{ secrets.SUPABASE_KEY }}|g" signup.html
          # Do the same for login.html if you have it ready
          if [ -f login.html ]; then
            sed -i "s|SEARCH_REPLACE_SUPABASE_URL|${{ secrets.SUPABASE_URL }}|g" login.html
            sed -i "s|SEARCH_REPLACE_SUPABASE_KEY|${{ secrets.SUPABASE_KEY }}|g" login.html
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . 
          branch: gh-pages
