<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - StudyApp</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .signup-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .signup-card h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 2rem;
        }

        .signup-card p {
            color: #777;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #6a11cb;
        }

        .btn-signup {
            width: 100%;
            padding: 12px;
            background: #6a11cb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-signup:hover {
            background: #2575fc;
        }

        .footer-links {
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: #6a11cb;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="signup-card">
        <h2>Create Account</h2>
        <p>Join the community and start studying smarter.</p>

        <form id="signupForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password (min 6 chars)" required>
            </div>
            <button type="submit" id="submitBtn" class="btn-signup">Create Account</button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="login.html">Sign In</a><br><br>
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        // Wrap everything in a function to prevent "already declared" errors
        (function() {
            const supabaseUrl = 'https://hpmbbjcybnzojgsepmdn.supabase.co';
            const supabaseKey = 'sb_publishable_HAX3ykxTnI81SHifNIyUwA_-BomdZrH';
            
            // Check if injection happened (for debugging)
            if (supabaseUrl === 'https://hpmbbjcybnzojgsepmdn.supabase.co') {
                console.error("Secrets not injected. Check GitHub Actions!");
            }

            const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

            const signupForm = document.getElementById('signupForm');
            const submitBtn = document.getElementById('submitBtn');

            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                submitBtn.innerText = "Creating Account...";
                submitBtn.disabled = true;

                const fullName = document.getElementById('fullName').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                full_name: fullName 
                            }
                        }
                    });

                    if (error) {
                        alert("Error: " + error.message);
                        submitBtn.innerText = "Create Account";
                        submitBtn.disabled = false;
                    } else {
                        console.log("Registered user:", data.user);
                        localStorage.setItem('loggedInUser', email);
                        window.location.href = 'dashboard.html';
                    }
                } catch (err) {
                    console.error("Unexpected error:", err);
                    submitBtn.innerText = "Create Account";
                    submitBtn.disabled = false;
                }
            });
        })();
    </script>

</body>
</html>
