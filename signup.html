<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - StudyApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .signup-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .signup-card h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 2rem;
        }

        .signup-card p {
            color: #777;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #6a11cb;
        }

        .btn-signup {
            width: 100%;
            padding: 12px;
            background: #6a11cb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-signup:hover {
            background: #2575fc;
        }

        .footer-links {
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: #6a11cb;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="signup-card">
        <h2>Create Account</h2>
        <p>Join the community and start studying smarter.</p>

        <form id="signupForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create a password (min 6 chars)" required>
            </div>
            <button type="submit" id="submitBtn" class="btn-signup">Create Account</button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="login.html">Sign In</a><br><br>
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script type="module">
        // 1. Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 2. Your web app's Firebase 
        const firebaseConfig = {
    apiKey: "SEARCH_REPLACE_API_KEY",
    authDomain: "SEARCH_REPLACE_AUTH_DOMAIN",
    projectId: "SEARCH_REPLACE_PROJECT_ID",
    storageBucket: "SEARCH_REPLACE_STORAGE_BUCKET",
    messagingSenderId: "SEARCH_REPLACE_SENDER_ID",
    appId: "SEARCH_REPLACE_APP_ID"
};


        // 3. Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const signupForm = document.getElementById('signupForm');
        const submitBtn = document.getElementById('submitBtn');

        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();

            // Change button text to show it's working
            submitBtn.innerText = "Creating Account...";
            submitBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // 4. Create User
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Success!
                    const user = userCredential.user;
                    console.log("Registered user:", user);
                    
                    // Optional: Store the email locally for the dashboard greeting
                    localStorage.setItem('loggedInUser', email);
                    
                    window.location.href = 'dashboard.html';
                })
                .catch((error) => {
                    // Handle Errors here.
                    const errorMessage = error.message;
                    alert("Error: " + errorMessage);
                    
                    // Reset button if there's an error
                    submitBtn.innerText = "Create Account";
                    submitBtn.disabled = false;
                });
        });
    </script>

</body>
</html>
